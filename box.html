<!DOCTYPE html>
<head>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Website Navigation Bar</title>

    <style>
        /* Reset default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Navigation bar */
        .navbar {
            background-color: #17365D;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* College logo */

        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        /* Navigation menu */
        .nav-links {
            list-style: none;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        /* Navigation links */
        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 4px;
            transition: color 0.3s ease;
        }

        /* Hover effect */
        .nav-links a:hover {
            color: #FFD166;
        }

        /* Responsive design for mobile screens */
        @media (max-width: 600px) {
            .navbar {
                justify-content: center;
                padding: 16px;
            }

            .logo {
                text-align: center;
            }

            .nav-links {
                justify-content: center;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">responsive navigation bar</div>

        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#courses">Courses</a></li>
            <li><a href="#faculty">Faculty</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

</body>
</html>
